name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ForbiddenItlwm (${{ matrix.target }})
    # tools/build.py cross-compiles for x86_64 (-arch x86_64) with the Command Line
    # Tools and MacKernelSDK only, so an Apple Silicon runner is enough. The
    # macos-15-intel runners are scarce and jobs often never got one.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One kext per macOS version; never load one on another macOS version.
        target: [sequoia, tahoe, sonoma]
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          # The commit docs/INSTALL.md says was tested.
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build ForbiddenItlwm for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 tools/build.py --target "$TARGET" --out "build/$TARGET" -j 4 \
            > "logs/ForbiddenItlwm-$TARGET.log" 2>&1 || { tail -100 "logs/ForbiddenItlwm-$TARGET.log"; exit 1; }
          tail -5 "logs/ForbiddenItlwm-$TARGET.log"
      - name: Package kernel extension
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version=$(sed -n "s/.*VER='\([^']*\)'.*/\1/p" tools/build.py | head -n 1)
          short_sha=$(git rev-parse --short HEAD)
          ditto -c -k --keepParent "build/$TARGET/ForbiddenItlwm.kext" \
            "artifacts/ForbiddenItlwm-$TARGET-v$version-alpha-$short_sha.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ForbiddenItlwm-${{ matrix.target }}
          path: artifacts/ForbiddenItlwm-${{ matrix.target }}-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.target }}
          path: logs

  prerelease:
    name: Publish development build
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: ForbiddenItlwm-*
          path: artifacts
          merge-multiple: true
      - name: Publish alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*VER='\([^']*\)'.*/\1/p" tools/build.py | head -n 1)
          tag="v$version-alpha"
          printf '%s\n\n' 'Development build. Hardware validation is required before daily use.' > ReleaseNotes.md
          git log -5 --format='- %h %s' >> ReleaseNotes.md
          if gh release view "$tag" --json isPrerelease > current-release.json 2>/dev/null; then
            # Never replace a stable release with development artifacts.
            jq -e '.isPrerelease == true' current-release.json > /dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$tag" --prerelease --notes-file ReleaseNotes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes-file ReleaseNotes.md
          fi
          gh release upload "$tag" artifacts/ForbiddenItlwm-*.zip --clobber

          # Remove obsolete assets of this development release only, after the
          # replacement set has uploaded. Other releases are left alone.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | [.id, .name] | @tsv' > release-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ ! -f "artifacts/$asset_name" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < release-assets.tsv
